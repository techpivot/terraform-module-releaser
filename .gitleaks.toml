# Gitleaks configuration.
#
# Extends the upstream default ruleset rather than replacing it, so new upstream detections are picked up
# automatically.

[extend]
useDefault = true

[[allowlists]]
description = """
dist/ is the ncc bundle, generated by release automation and never hand-edited. It inlines dependency source
including their JSDoc, so documentation examples such as @actions/core's `const apiToken = "abc123xyz456"` for
setSecret() are flagged as generic API keys. Secrets are caught in the sources that produce the bundle.
"""
paths = ['''^dist/''']
